<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A* Pathfinding Academy — Map & Sliders</title>
    
    <!-- Retro Fonts & Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #090d16;
            --ut-gold: #fbbf24;
            --ut-yellow: #fde047;
            --ut-cyan: #38bdf8;
            --ut-green: #34d399;
            --ut-purple: #c084fc;
            --ut-red: #f87171;
            --font-pixel: 'Press Start 2P', monospace;
            --font-retro: 'VT323', monospace;
            --font-code: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-canvas);
            color: #f8fafc;
            font-family: var(--font-retro);
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.07) 0%, transparent 50%),
                radial-gradient(circle at 85% 25%, rgba(251, 191, 36, 0.07) 0%, transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(52, 211, 153, 0.05) 0%, transparent 55%);
        }

        /* Sliders Overlay Dock */
        .sliders-bar {
            background: rgba(19, 29, 46, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .cost-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 4px;
            outline: none;
            border: 1px solid #475569;
            cursor: pointer;
        }
        .cost-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 2px solid #fff;
            cursor: pointer;
            transition: all 0.1s;
        }
        .slider-rock::-webkit-slider-thumb { background: #94a3b8; box-shadow: 0 0 8px #94a3b8; }
        .slider-sand::-webkit-slider-thumb { background: #facc15; box-shadow: 0 0 8px #facc15; }
        .slider-near::-webkit-slider-thumb { background: #f87171; box-shadow: 0 0 8px #f87171; }
        .cost-slider:hover::-webkit-slider-thumb { transform: scale(1.25); }

        .ut-btn {
            font-family: var(--font-pixel);
            font-size: 8.5px;
            padding: 6px 12px;
            background: #1e293b;
            color: #f8fafc;
            border: 2px solid #475569;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .ut-btn:hover {
            background: var(--ut-gold);
            color: #0f172a;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            transform: translateY(-1px);
        }

        /* ==========================================================================
           FULLSCREEN GRID & RICH PIXEL TEXTURES
           ========================================================================== */
        
        #map-stage {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        #grid-container {
            display: grid;
            gap: 2px;
            background: #020617;
            padding: 6px;
            border-radius: 6px;
            border: 2.5px solid #334155;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        .map-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            font-family: var(--font-code);
            cursor: pointer;
            transition: transform 0.08s;
            overflow: hidden;
        }
        .map-cell:hover {
            outline: 2px solid #fff;
            z-index: 30;
            transform: scale(1.15);
        }

        /* 1. Normal Plains Tile */
        .tile-normal {
            background-color: #1a2538;
            border: 1px solid #28374f;
            background-image: 
                radial-gradient(#24334a 12%, transparent 12%),
                radial-gradient(#24334a 12%, transparent 12%);
            background-size: 8px 8px;
            background-position: 0 0, 4px 4px;
        }

        /* 2. Rich Rocky Mountain Crags (Chiseled facets, shadows & peaks) */
        .tile-rock {
            background-color: #44403c;
            border: 1px solid #78716c;
            background-image: 
                linear-gradient(135deg, #57534e 25%, transparent 25%), 
                linear-gradient(225deg, #292524 25%, transparent 25%), 
                linear-gradient(45deg, #1c1917 25%, transparent 25%), 
                linear-gradient(315deg, #78716c 25%, #44403c 25%);
            background-position: 6px 0, 6px 0, 0 0, 0 0;
            background-size: 12px 12px;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.15), inset -1px -1px 0 rgba(0,0,0,0.5);
        }
        .tile-rock::after {
            content: '▲';
            font-size: 10px;
            color: #d6d3d1;
            text-shadow: 1px 1px 0 #1c1917;
            opacity: 0.9;
        }

        /* 3. Rich Sandy Desert Dunes (Wavy ripple lines & gold specks) */
        .tile-sand {
            background-color: #9a6813;
            border: 1px solid #d97706;
            background-image: 
                radial-gradient(#fde047 15%, transparent 16%),
                radial-gradient(#78350f 15%, transparent 16%),
                linear-gradient(45deg, transparent 46%, #b45309 48%, #b45309 52%, transparent 54%),
                linear-gradient(-45deg, transparent 46%, #fef08a 48%, #fef08a 52%, transparent 54%);
            background-size: 8px 8px, 8px 8px, 16px 16px, 16px 16px;
            background-position: 0 0, 4px 4px, 0 0, 8px 8px;
            box-shadow: inset 0 0 4px rgba(254, 240, 138, 0.25);
        }
        .tile-sand::after {
            content: '░';
            font-size: 12px;
            color: #fef08a;
            opacity: 0.85;
            font-weight: bold;
        }

        /* 4. Rich Impassable Fortress Obstacle Wall */
        .tile-wall {
            background-color: #0b101b;
            border: 1.5px solid #1e293b;
            background-image: 
                linear-gradient(to right, #1e293b 1px, transparent 1px),
                linear-gradient(to bottom, #1e293b 1px, transparent 1px),
                radial-gradient(#334155 15%, transparent 15%);
            background-size: 8px 6px, 8px 6px, 4px 4px;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.1), inset -2px -2px 3px rgba(0,0,0,0.95);
        }
        .tile-wall::after {
            content: '■';
            font-size: 11px;
            color: #64748b;
            text-shadow: 0 0 3px #000;
        }

        /* Near-Obstacle Hazard Warning Glow */
        .hazard-1 {
            box-shadow: inset 0 0 0 2px rgba(248, 113, 113, 0.7), inset 0 0 6px rgba(248, 113, 113, 0.45) !important;
        }
        .hazard-2 {
            box-shadow: inset 0 0 0 1px rgba(251, 146, 60, 0.45) !important;
        }

        /* A* Path Marking */
        .cell-path {
            background: #fbbf24 !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 14px #fbbf24, inset 0 0 5px #ffffff;
            z-index: 20;
            animation: pathGlow 0.7s infinite alternate;
        }
        @keyframes pathGlow {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.12); filter: brightness(1.3); }
        }

        /* Start & Goal Nodes */
        .cell-start {
            background: #10b981 !important;
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 16px #10b981;
            z-index: 25;
        }
        .cell-goal {
            background: #ef4444 !important;
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 16px #ef4444;
            z-index: 25;
        }

        /* Animated Character Sprite at Start */
        .char-sprite {
            position: absolute;
            width: 28px;
            height: 32px;
            z-index: 40;
            pointer-events: none;
            transition: all 0.14s linear;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .char-hat {
            width: 15px; height: 7px;
            background: #fbbf24;
            border: 1px solid #000;
            margin-bottom: -1px;
            border-radius: 2px 2px 0 0;
            box-shadow: 0 0 6px #fbbf24;
        }
        .char-body {
            width: 20px; height: 18px;
            background: #38bdf8;
            border: 2px solid #fff;
            border-radius: 3px;
            position: relative;
            box-shadow: 0 0 12px #38bdf8;
            animation: charBounce 0.2s infinite alternate;
        }
        .char-eyes {
            position: absolute;
            top: 3px; left: 3px; right: 3px;
            display: flex;
            justify-content: space-between;
        }
        .char-eye { width: 3px; height: 5px; background: #0f172a; border-radius: 1px; }
        .char-feet {
            display: flex;
            justify-content: space-between;
            width: 16px;
            margin-top: 1px;
        }
        .char-foot {
            width: 5px; height: 4px;
            background: #fde047;
            border: 1px solid #000;
            animation: charLegs 0.2s infinite alternate;
        }
        .char-foot:last-child { animation-delay: 0.1s; }

        @keyframes charBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-2px); } }
        @keyframes charLegs { 0% { transform: translateY(0); } 100% { transform: translateY(2px); } }

        .goal-star {
            font-size: 15px;
            color: #ffffff;
            filter: drop-shadow(0 0 8px #ffff00);
            animation: starSpin 3s linear infinite;
        }
        @keyframes starSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Pixel Soul Heart */
        .pixel-heart {
            display: inline-block;
            width: 13px; height: 13px;
            background-color: var(--ut-red);
            clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 50% 75%, 18% 100%, 0% 35%);
            filter: drop-shadow(0 0 5px rgba(248, 113, 113, 0.8));
            vertical-align: middle;
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <!-- TOP DOCK: ONLY THE 3 COST WEIGHT SLIDERS & RANDOMIZE BUTTON -->
    <div class="sliders-bar px-6 py-2.5 flex items-center justify-between gap-6 shrink-0">
        
        <!-- Brand Indicator -->
        <div class="flex items-center gap-2 shrink-0">
            <span class="pixel-heart"></span>
            <span class="font-bold text-xs tracking-wider" style="font-family: var(--font-pixel); color: var(--ut-gold);">A* PATHFINDER</span>
        </div>

        <!-- 3 Cursors (Sliders) -->
        <div class="flex-1 flex items-center justify-around gap-8 max-w-5xl">
            
            <!-- Slider 1: Rocky Structure Weight -->
            <div class="flex-1 flex flex-col gap-0.5">
                <div class="flex justify-between items-center text-xs font-mono">
                    <span class="flex items-center gap-1 font-bold text-stone-300">
                        <span>▲</span> ROCK WEIGHT (W_rock)
                    </span>
                    <span class="text-yellow-300 font-bold text-sm" id="val-rock">4.0×</span>
                </div>
                <input type="range" min="0" max="15" step="0.5" value="4.0" class="cost-slider slider-rock" id="slider-rock">
            </div>

            <!-- Slider 2: Sandy Structure Weight -->
            <div class="flex-1 flex flex-col gap-0.5">
                <div class="flex justify-between items-center text-xs font-mono">
                    <span class="flex items-center gap-1 font-bold text-yellow-300">
                        <span>░</span> SAND WEIGHT (W_sand)
                    </span>
                    <span class="text-yellow-300 font-bold text-sm" id="val-sand">2.5×</span>
                </div>
                <input type="range" min="0" max="15" step="0.5" value="2.5" class="cost-slider slider-sand" id="slider-sand">
            </div>

            <!-- Slider 3: Near-Obstacle Clearance Penalty -->
            <div class="flex-1 flex flex-col gap-0.5">
                <div class="flex justify-between items-center text-xs font-mono">
                    <span class="flex items-center gap-1 font-bold text-red-400">
                        <span>⚠️</span> NEAR-OBSTACLE HAZARD (W_near)
                    </span>
                    <span class="text-yellow-300 font-bold text-sm" id="val-near">5.0×</span>
                </div>
                <input type="range" min="0" max="20" step="0.5" value="5.0" class="cost-slider slider-near" id="slider-near">
            </div>

        </div>

        <!-- Re-Randomize Button -->
        <div class="flex items-center gap-2 shrink-0">
            <button class="ut-btn bg-purple-950/80 border-purple-500 text-purple-300 hover:bg-purple-500 hover:text-black font-bold" id="btn-randomize" title="Randomize structure locations (Hotkey: R)">
                <span>🎲</span> RANDOMIZE MAP
            </button>
        </div>
    </div>

    <!-- MAIN MAP CANVAS (FILLS ENTIRE SCREEN) -->
    <main id="map-stage">
        <div id="grid-container"></div>

        <!-- Animated Character Sprite at the foot of Start Point -->
        <div class="char-sprite" id="character-sprite" style="display: none;">
            <div class="char-hat"></div>
            <div class="char-body">
                <div class="char-eyes">
                    <div class="char-eye"></div>
                    <div class="char-eye"></div>
                </div>
            </div>
            <div class="char-feet">
                <div class="char-foot"></div>
                <div class="char-foot"></div>
            </div>
        </div>
    </main>

    <!-- A* Pathfinding Logic -->
    <script>
        const COLS = 32;
        const ROWS = 18;

        const TILE_NORMAL = 0;
        const TILE_ROCK   = 1;
        const TILE_SAND   = 2;
        const TILE_WALL   = 3;

        let grid = [];
        let hazardMap = [];
        let startPos = { x: 1, y: 9 };
        let goalPos  = { x: 30, y: 9 };

        let weightRock = 4.0;
        let weightSand = 2.5;
        let weightNear = 5.0;

        let pathNodes = [];
        let nodeDetails = new Map();
        let closedSet = new Set();
        let openSet = [];

        const DOM = {
            gridContainer: document.getElementById('grid-container'),
            mapStage: document.getElementById('map-stage'),
            charSprite: document.getElementById('character-sprite'),
            sliderRock: document.getElementById('slider-rock'),
            sliderSand: document.getElementById('slider-sand'),
            sliderNear: document.getElementById('slider-near'),
            valRock: document.getElementById('val-rock'),
            valSand: document.getElementById('val-sand'),
            valNear: document.getElementById('val-near'),
            btnRandomize: document.getElementById('btn-randomize')
        };

        // Initialize 2D Grid
        function initGrid() {
            grid = [];
            hazardMap = [];
            for (let y = 0; y < ROWS; y++) {
                grid[y] = [];
                hazardMap[y] = [];
                for (let x = 0; x < COLS; x++) {
                    grid[y][x] = TILE_NORMAL;
                    hazardMap[y][x] = 0.0;
                }
            }
        }

        // Proximity Hazard Field (Near-Obstacle Areas)
        function computeHazardMap() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (grid[y][x] === TILE_WALL) {
                        hazardMap[y][x] = 0;
                        continue;
                    }
                    let minD = 999;
                    for (let dy = -2; dy <= 2; dy++) {
                        for (let dx = -2; dx <= 2; dx++) {
                            const ny = y + dy;
                            const nx = x + dx;
                            if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS) {
                                if (grid[ny][nx] === TILE_WALL) {
                                    const d = Math.hypot(dx, dy);
                                    if (d < minD) minD = d;
                                }
                            }
                        }
                    }
                    if (minD <= 1.0) hazardMap[y][x] = 1.0;
                    else if (minD <= 1.5) hazardMap[y][x] = 0.5;
                    else if (minD <= 2.1) hazardMap[y][x] = 0.25;
                    else hazardMap[y][x] = 0.0;
                }
            }
        }

        // Build DOM Table
        function buildGridDOM() {
            DOM.gridContainer.innerHTML = '';
            DOM.gridContainer.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            DOM.gridContainer.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'map-cell tile-normal';
                    cell.id = `cell-${x}-${y}`;

                    // Clicking any tile relocates start point and tests path immediately
                    cell.addEventListener('click', () => {
                        if (grid[y][x] === TILE_WALL) return;
                        startPos = { x, y };
                        updateCellVisuals();
                        runAStarInstant();
                    });

                    DOM.gridContainer.appendChild(cell);
                }
            }
            window.addEventListener('resize', () => { positionCharacterSprite(startPos.x, startPos.y); });
        }

        // Render Visual Styles
        function updateCellVisuals() {
            computeHazardMap();
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = document.getElementById(`cell-${x}-${y}`);
                    if (!cell) continue;

                    cell.className = 'map-cell';

                    if (grid[y][x] === TILE_WALL) cell.classList.add('tile-wall');
                    else if (grid[y][x] === TILE_ROCK) cell.classList.add('tile-rock');
                    else if (grid[y][x] === TILE_SAND) cell.classList.add('tile-sand');
                    else cell.classList.add('tile-normal');

                    if (grid[y][x] !== TILE_WALL) {
                        if (hazardMap[y][x] >= 0.8) cell.classList.add('hazard-1');
                        else if (hazardMap[y][x] > 0) cell.classList.add('hazard-2');
                    }

                    if (x === startPos.x && y === startPos.y) {
                        cell.classList.add('cell-start');
                        cell.innerHTML = '🚩';
                    } else if (x === goalPos.x && y === goalPos.y) {
                        cell.classList.add('cell-goal');
                        cell.innerHTML = '<span class="goal-star">★</span>';
                    } else {
                        cell.innerHTML = '';
                    }
                }
            }
            positionCharacterSprite(startPos.x, startPos.y);
        }

        function positionCharacterSprite(gx, gy) {
            const cell = document.getElementById(`cell-${gx}-${gy}`);
            if (!cell || !DOM.charSprite) return;
            const rect = cell.getBoundingClientRect();
            const wrapRect = DOM.mapStage.getBoundingClientRect();

            DOM.charSprite.style.display = 'flex';
            DOM.charSprite.style.left = `${rect.left - wrapRect.left + rect.width / 2 - 14}px`;
            DOM.charSprite.style.top = `${rect.top - wrapRect.top - 24}px`;
        }

        // =========================================================================
        // PROCEDURAL RANDOMIZATION OF STRUCTURE LOCATIONS
        // =========================================================================
        function randomizeStructures() {
            initGrid();

            // Randomize start position on far left (column 1, random row 2..15)
            startPos = { x: 1, y: 2 + Math.floor(Math.random() * (ROWS - 4)) };
            goalPos  = { x: COLS - 2, y: 2 + Math.floor(Math.random() * (ROWS - 4)) };

            const protectedCells = new Set();
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    protectedCells.add(`${startPos.x + dx},${startPos.y + dy}`);
                    protectedCells.add(`${goalPos.x + dx},${goalPos.y + dy}`);
                }
            }

            // 1. Randomize Fortress Obstacle Walls (Scattered barriers)
            const wallClusters = 5 + Math.floor(Math.random() * 3);
            for (let c = 0; c < wallClusters; c++) {
                const cx = 5 + Math.floor(Math.random() * (COLS - 10));
                const cy = 2 + Math.floor(Math.random() * (ROWS - 4));
                const length = 3 + Math.floor(Math.random() * 5);
                const isVertical = Math.random() > 0.45;

                for (let step = 0; step < length; step++) {
                    const wx = isVertical ? cx : cx + step;
                    const wy = isVertical ? cy + step : cy;
                    if (wx >= 3 && wx < COLS - 3 && wy >= 0 && wy < ROWS) {
                        if (!protectedCells.has(`${wx},${wy}`)) {
                            grid[wy][wx] = TILE_WALL;
                        }
                    }
                }
            }

            // 2. Randomize Rocky Mountain Formations
            const rockBlobs = 4 + Math.floor(Math.random() * 3);
            for (let b = 0; b < rockBlobs; b++) {
                const bx = 3 + Math.floor(Math.random() * (COLS - 6));
                const by = 1 + Math.floor(Math.random() * (ROWS - 2));
                const radius = 2 + Math.floor(Math.random() * 3);

                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const rx = bx + dx;
                        const ry = by + dy;
                        if (rx >= 0 && rx < COLS && ry >= 0 && ry < ROWS) {
                            if (Math.hypot(dx, dy) <= radius && grid[ry][rx] === TILE_NORMAL && !protectedCells.has(`${rx},${ry}`)) {
                                if (Math.random() > 0.15) grid[ry][rx] = TILE_ROCK;
                            }
                        }
                    }
                }
            }

            // 3. Randomize Sandy Desert Dunes
            const sandBlobs = 4 + Math.floor(Math.random() * 3);
            for (let s = 0; s < sandBlobs; s++) {
                const sx = 3 + Math.floor(Math.random() * (COLS - 6));
                const sy = 1 + Math.floor(Math.random() * (ROWS - 2));
                const radius = 2 + Math.floor(Math.random() * 3);

                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const px = sx + dx;
                        const py = sy + dy;
                        if (px >= 0 && px < COLS && py >= 0 && py < ROWS) {
                            if (Math.hypot(dx, dy) <= radius && grid[py][px] === TILE_NORMAL && !protectedCells.has(`${px},${py}`)) {
                                if (Math.random() > 0.15) grid[py][px] = TILE_SAND;
                            }
                        }
                    }
                }
            }

            // 4. Guarantee open navigation route from start to goal
            let wx = startPos.x;
            let wy = startPos.y;
            while (wx < goalPos.x) {
                if (grid[wy][wx] === TILE_WALL) grid[wy][wx] = TILE_NORMAL;
                if (Math.random() > 0.4) wx++;
                else {
                    const stepY = (wy < goalPos.y) ? 1 : (wy > goalPos.y ? -1 : (Math.random() > 0.5 ? 1 : -1));
                    if (wy + stepY >= 0 && wy + stepY < ROWS) wy += stepY;
                }
            }

            updateCellVisuals();
            runAStarInstant();
        }

        // Traversal Cost Formula
        function getTileTraversalCost(x, y) {
            if (grid[y][x] === TILE_WALL) return Infinity;
            let cost = 1.0;
            if (grid[y][x] === TILE_ROCK) cost += weightRock;
            if (grid[y][x] === TILE_SAND) cost += weightSand;
            cost += (hazardMap[y][x] * weightNear);
            return cost;
        }

        function heuristic(x1, y1, x2, y2) {
            return Math.hypot(x1 - x2, y1 - y2);
        }

        // A* Path Calculation
        function runAStarInstant() {
            nodeDetails.clear();
            closedSet.clear();
            pathNodes = [];

            document.querySelectorAll('.map-cell').forEach(c => {
                c.classList.remove('cell-path');
            });

            const startKey = `${startPos.x},${startPos.y}`;
            const startNode = {
                x: startPos.x, y: startPos.y,
                g: 0, h: heuristic(startPos.x, startPos.y, goalPos.x, goalPos.y),
                f: 0, parent: null
            };
            startNode.f = startNode.g + startNode.h;

            openSet = [startNode];
            nodeDetails.set(startKey, startNode);

            while (openSet.length > 0) {
                let lowestIdx = 0;
                for (let i = 1; i < openSet.length; i++) {
                    if (openSet[i].f < openSet[lowestIdx].f) lowestIdx = i;
                }

                const current = openSet.splice(lowestIdx, 1)[0];
                const currentKey = `${current.x},${current.y}`;
                closedSet.add(currentKey);

                if (current.x === goalPos.x && current.y === goalPos.y) {
                    reconstructPath(current);
                    return true;
                }

                const neighbors = [
                    { dx: 0, dy: -1, diag: false },
                    { dx: 1, dy: 0,  diag: false },
                    { dx: 0, dy: 1,  diag: false },
                    { dx: -1, dy: 0, diag: false },
                    { dx: 1, dy: -1, diag: true },
                    { dx: 1, dy: 1,  diag: true },
                    { dx: -1, dy: 1, diag: true },
                    { dx: -1, dy: -1, diag: true }
                ];

                for (const nb of neighbors) {
                    const nx = current.x + nb.dx;
                    const ny = current.y + nb.dy;

                    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
                    if (grid[ny][nx] === TILE_WALL) continue;
                    if (nb.diag && (grid[current.y][nx] === TILE_WALL || grid[ny][current.x] === TILE_WALL)) continue;

                    const neighborKey = `${nx},${ny}`;
                    if (closedSet.has(neighborKey)) continue;

                    const stepDist = nb.diag ? Math.SQRT2 : 1.0;
                    const tileCost = getTileTraversalCost(nx, ny);
                    const tentativeG = current.g + (stepDist * tileCost);

                    let neighborNode = nodeDetails.get(neighborKey);

                    if (!neighborNode) {
                        neighborNode = {
                            x: nx, y: ny, g: tentativeG,
                            h: heuristic(nx, ny, goalPos.x, goalPos.y),
                            f: 0, parent: current
                        };
                        neighborNode.f = neighborNode.g + neighborNode.h;
                        nodeDetails.set(neighborKey, neighborNode);
                        openSet.push(neighborNode);
                    } else if (tentativeG < neighborNode.g) {
                        neighborNode.g = tentativeG;
                        neighborNode.f = neighborNode.g + neighborNode.h;
                        neighborNode.parent = current;
                    }
                }
            }
            return false;
        }

        function reconstructPath(goalNode) {
            pathNodes = [];
            let curr = goalNode;
            while (curr) {
                pathNodes.push(curr);
                curr = curr.parent;
            }
            pathNodes.reverse();

            pathNodes.forEach((node) => {
                const cell = document.getElementById(`cell-${node.x}-${node.y}`);
                if (cell && (node.x !== startPos.x || node.y !== startPos.y) && (node.x !== goalPos.x || node.y !== goalPos.y)) {
                    cell.classList.add('cell-path');
                }
            });
        }

        // Sliders Listeners
        DOM.sliderRock.addEventListener('input', (e) => {
            weightRock = parseFloat(e.target.value);
            DOM.valRock.textContent = `${weightRock.toFixed(1)}×`;
            runAStarInstant();
        });

        DOM.sliderSand.addEventListener('input', (e) => {
            weightSand = parseFloat(e.target.value);
            DOM.valSand.textContent = `${weightSand.toFixed(1)}×`;
            runAStarInstant();
        });

        DOM.sliderNear.addEventListener('input', (e) => {
            weightNear = parseFloat(e.target.value);
            DOM.valNear.textContent = `${weightNear.toFixed(1)}×`;
            updateCellVisuals();
            runAStarInstant();
        });

        DOM.btnRandomize.addEventListener('click', () => {
            randomizeStructures();
        });

        // Hotkey: R to randomize
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyR') { e.preventDefault(); randomizeStructures(); }
        });

        // Boot with procedural randomized structures!
        buildGridDOM();
        randomizeStructures();
    </script>
</body>
</html>
