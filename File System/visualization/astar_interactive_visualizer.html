<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A* Pathfinding Academy — High-Density Grid Simulator</title>
    
    <!-- Retro Fonts & Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #090d16;
            --ut-gold: #fbbf24;
            --ut-yellow: #fde047;
            --ut-cyan: #38bdf8;
            --ut-green: #34d399;
            --ut-purple: #c084fc;
            --ut-red: #f87171;
            --font-pixel: 'Press Start 2P', monospace;
            --font-retro: 'VT323', monospace;
            --font-code: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-canvas);
            color: #f8fafc;
            font-family: var(--font-retro);
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 25%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(52, 211, 153, 0.06) 0%, transparent 55%);
        }

        /* Top Sliders Bar */
        .sliders-bar {
            background: rgba(19, 29, 46, 0.94);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .cost-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 4px;
            outline: none;
            border: 1px solid #475569;
            cursor: pointer;
        }
        .cost-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 2px solid #fff;
            cursor: pointer;
            transition: all 0.1s;
        }
        .slider-rock::-webkit-slider-thumb { background: #94a3b8; box-shadow: 0 0 8px #94a3b8; }
        .slider-sand::-webkit-slider-thumb { background: #facc15; box-shadow: 0 0 8px #facc15; }
        .slider-near::-webkit-slider-thumb { background: #f87171; box-shadow: 0 0 10px #f87171; }
        .cost-slider:hover::-webkit-slider-thumb { transform: scale(1.25); }

        .ut-btn {
            font-family: var(--font-pixel);
            font-size: 8.5px;
            padding: 6px 12px;
            background: #1e293b;
            color: #f8fafc;
            border: 2px solid #475569;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .ut-btn:hover {
            background: var(--ut-gold);
            color: #0f172a;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            transform: translateY(-1px);
        }

        /* ==========================================================================
           HIGH-DENSITY GRID (48 × 27 = 1,296 TILES) & FINE PIXEL TEXTURES
           ========================================================================== */
        
        #map-stage {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
        }

        #grid-container {
            display: grid;
            gap: 1px;
            background: #020617;
            padding: 4px;
            border-radius: 6px;
            border: 2px solid #334155;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
        }

        .map-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1.5px;
            font-family: var(--font-code);
            cursor: pointer;
            transition: transform 0.06s, box-shadow 0.1s;
            overflow: hidden;
        }
        .map-cell:hover {
            outline: 2px solid #fff;
            z-index: 30;
            transform: scale(1.25);
        }

        /* 1. Fine Normal Plains Tile */
        .tile-normal {
            background-color: #1a2538;
            border: 0.5px solid #28374f;
            background-image: radial-gradient(#24334a 15%, transparent 15%);
            background-size: 6px 6px;
        }

        /* 2. Fine Rocky Mountain Crags */
        .tile-rock {
            background-color: #44403c;
            border: 0.5px solid #78716c;
            background-image: 
                linear-gradient(135deg, #57534e 25%, transparent 25%), 
                linear-gradient(225deg, #292524 25%, transparent 25%), 
                linear-gradient(45deg, #1c1917 25%, transparent 25%), 
                linear-gradient(315deg, #78716c 25%, #44403c 25%);
            background-size: 8px 8px;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.15), inset -1px -1px 0 rgba(0,0,0,0.5);
        }
        .tile-rock::after {
            content: '▲';
            font-size: 8px;
            color: #d6d3d1;
            text-shadow: 1px 1px 0 #1c1917;
            opacity: 0.9;
        }

        /* 3. Fine Sandy Desert Dunes */
        .tile-sand {
            background-color: #9a6813;
            border: 0.5px solid #d97706;
            background-image: 
                radial-gradient(#fde047 16%, transparent 17%),
                radial-gradient(#78350f 16%, transparent 17%),
                linear-gradient(45deg, transparent 46%, #b45309 48%, #b45309 52%, transparent 54%);
            background-size: 6px 6px, 6px 6px, 12px 12px;
            box-shadow: inset 0 0 3px rgba(254, 240, 138, 0.3);
        }
        .tile-sand::after {
            content: '░';
            font-size: 9.5px;
            color: #fef08a;
            opacity: 0.85;
            font-weight: bold;
        }

        /* 4. Fine Impassable Fortress Obstacle Wall */
        .tile-wall {
            background-color: #0b101b;
            border: 1px solid #1e293b;
            background-image: 
                linear-gradient(to right, #1e293b 1px, transparent 1px),
                linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 6px 4px;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.1), inset -1px -1px 3px rgba(0,0,0,0.95);
        }
        .tile-wall::after {
            content: '■';
            font-size: 8.5px;
            color: #64748b;
            text-shadow: 0 0 2px #000;
        }

        /* Dynamic Obstacle Inflation Tiers (Multi-ring radial gradient) */
        .hazard-1 {
            box-shadow: inset 0 0 0 2px rgba(239, 68, 68, 0.9), inset 0 0 8px rgba(239, 68, 68, 0.55) !important;
            background-color: rgba(185, 28, 28, 0.35) !important;
        }
        .hazard-2 {
            box-shadow: inset 0 0 0 1.5px rgba(249, 115, 22, 0.75), inset 0 0 6px rgba(249, 115, 22, 0.35) !important;
            background-color: rgba(194, 65, 12, 0.24) !important;
        }
        .hazard-3 {
            box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.6) !important;
            background-color: rgba(180, 83, 9, 0.18) !important;
        }
        .hazard-4 {
            box-shadow: inset 0 0 0 1px rgba(254, 240, 138, 0.4) !important;
            background-color: rgba(254, 240, 138, 0.1) !important;
        }

        /* A* Path Marking */
        .cell-path {
            background: #fbbf24 !important;
            border: 1.5px solid #ffffff !important;
            box-shadow: 0 0 10px #fbbf24, inset 0 0 4px #ffffff;
            z-index: 20;
            animation: pathGlow 0.7s infinite alternate;
        }
        @keyframes pathGlow {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.15); filter: brightness(1.3); }
        }

        /* Start & Goal Nodes */
        .cell-start {
            background: #10b981 !important;
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 14px #10b981;
            z-index: 25;
            font-size: 11px;
        }
        .cell-goal {
            background: #ef4444 !important;
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 14px #ef4444;
            z-index: 25;
        }

        /* Scaled Character Sprite for High-Density Grid */
        .char-sprite {
            position: absolute;
            width: 22px;
            height: 26px;
            z-index: 40;
            pointer-events: none;
            transition: all 0.12s linear;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .char-hat {
            width: 12px; height: 5px;
            background: #fbbf24;
            border: 1px solid #000;
            margin-bottom: -1px;
            border-radius: 2px 2px 0 0;
            box-shadow: 0 0 6px #fbbf24;
        }
        .char-body {
            width: 16px; height: 14px;
            background: #38bdf8;
            border: 1.5px solid #fff;
            border-radius: 2px;
            position: relative;
            box-shadow: 0 0 8px #38bdf8;
            animation: charBounce 0.2s infinite alternate;
        }
        .char-eyes {
            position: absolute;
            top: 2px; left: 2px; right: 2px;
            display: flex;
            justify-content: space-between;
        }
        .char-eye { width: 2.5px; height: 4px; background: #0f172a; border-radius: 1px; }
        .char-feet {
            display: flex;
            justify-content: space-between;
            width: 13px;
            margin-top: 1px;
        }
        .char-foot {
            width: 4px; height: 3px;
            background: #fde047;
            border: 1px solid #000;
            animation: charLegs 0.2s infinite alternate;
        }
        .char-foot:last-child { animation-delay: 0.1s; }

        @keyframes charBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-1.5px); } }
        @keyframes charLegs { 0% { transform: translateY(0); } 100% { transform: translateY(1.5px); } }

        .goal-star {
            font-size: 13px;
            color: #ffffff;
            filter: drop-shadow(0 0 6px #ffff00);
            animation: starSpin 3s linear infinite;
        }
        @keyframes starSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .pixel-heart {
            display: inline-block;
            width: 14px; height: 14px;
            background-color: var(--ut-red);
            clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 50% 75%, 18% 100%, 0% 35%);
            filter: drop-shadow(0 0 6px rgba(248, 113, 113, 0.8));
            vertical-align: middle;
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <!-- TOP DOCK: ONLY THE 3 COST SLIDERS & CLUSTER RANDOMIZER -->
    <div class="sliders-bar px-6 py-2.5 flex items-center justify-between gap-6 shrink-0">
        
        <!-- Indicator -->
        <div class="flex items-center gap-2 shrink-0">
            <span class="pixel-heart"></span>
            <span class="font-bold text-xs tracking-wider" style="font-family: var(--font-pixel); color: var(--ut-gold);">A* HIGH-RES (48 × 27)</span>
        </div>

        <!-- 3 Cursors (Sliders) -->
        <div class="flex-1 flex items-center justify-around gap-8 max-w-5xl">
            
            <!-- Slider 1: Rocky Structure Weight -->
            <div class="flex-1 flex flex-col gap-0.5">
                <div class="flex justify-between items-center text-xs font-mono">
                    <span class="flex items-center gap-1 font-bold text-stone-300">
                        <span>▲</span> ROCK MASS WEIGHT (W_rock)
                    </span>
                    <span class="text-yellow-300 font-bold text-sm" id="val-rock">4.0×</span>
                </div>
                <input type="range" min="0" max="15" step="0.5" value="4.0" class="cost-slider slider-rock" id="slider-rock">
            </div>

            <!-- Slider 2: Sandy Structure Weight -->
            <div class="flex-1 flex flex-col gap-0.5">
                <div class="flex justify-between items-center text-xs font-mono">
                    <span class="flex items-center gap-1 font-bold text-yellow-300">
                        <span>░</span> SAND DUNE WEIGHT (W_sand)
                    </span>
                    <span class="text-yellow-300 font-bold text-sm" id="val-sand">2.5×</span>
                </div>
                <input type="range" min="0" max="15" step="0.5" value="2.5" class="cost-slider slider-sand" id="slider-sand">
            </div>

            <!-- Slider 3: Near-Obstacle Hazard & Dynamic Inflation -->
            <div class="flex-1 flex flex-col gap-0.5">
                <div class="flex justify-between items-center text-xs font-mono">
                    <span class="flex items-center gap-1 font-bold text-red-400">
                        <span>⚠️</span> OBSTACLE INFLATION (W_near)
                    </span>
                    <span class="text-yellow-300 font-bold text-sm" id="val-near">5.0× (Radius: 2)</span>
                </div>
                <input type="range" min="0" max="20" step="0.5" value="5.0" class="cost-slider slider-near" id="slider-near">
            </div>

        </div>

        <!-- Randomize Clusters Button -->
        <div class="flex items-center gap-2 shrink-0">
            <button class="ut-btn bg-purple-950/80 border-purple-500 text-purple-300 hover:bg-purple-500 hover:text-black font-bold" id="btn-randomize" title="Randomize contiguous clusters (Hotkey: R)">
                <span>🎲</span> RANDOMIZE CLUSTERS
            </button>
        </div>
    </div>

    <!-- MAIN MAP CANVAS (48 × 27 = 1,296 HIGH DENSITY CELLS) -->
    <main id="map-stage">
        <div id="grid-container"></div>

        <!-- Animated Character Sprite at Start -->
        <div class="char-sprite" id="character-sprite" style="display: none;">
            <div class="char-hat"></div>
            <div class="char-body">
                <div class="char-eyes">
                    <div class="char-eye"></div>
                    <div class="char-eye"></div>
                </div>
            </div>
            <div class="char-feet">
                <div class="char-foot"></div>
                <div class="char-foot"></div>
            </div>
        </div>
    </main>

    <script>
        // High density grid resolution: 48 columns × 27 rows (1,296 tiles)
        const COLS = 48;
        const ROWS = 27;

        const TILE_NORMAL = 0;
        const TILE_ROCK   = 1;
        const TILE_SAND   = 2;
        const TILE_WALL   = 3;

        let grid = [];
        let hazardMap = [];
        let startPos = { x: 2, y: 13 };
        let goalPos  = { x: COLS - 3, y: 13 };

        let weightRock = 4.0;
        let weightSand = 2.5;
        let weightNear = 5.0;

        let pathNodes = [];
        let nodeDetails = new Map();
        let closedSet = new Set();
        let openSet = [];

        const DOM = {
            gridContainer: document.getElementById('grid-container'),
            mapStage: document.getElementById('map-stage'),
            charSprite: document.getElementById('character-sprite'),
            sliderRock: document.getElementById('slider-rock'),
            sliderSand: document.getElementById('slider-sand'),
            sliderNear: document.getElementById('slider-near'),
            valRock: document.getElementById('val-rock'),
            valSand: document.getElementById('val-sand'),
            valNear: document.getElementById('val-near'),
            btnRandomize: document.getElementById('btn-randomize')
        };

        function initGrid() {
            grid = [];
            hazardMap = [];
            for (let y = 0; y < ROWS; y++) {
                grid[y] = [];
                hazardMap[y] = [];
                for (let x = 0; x < COLS; x++) {
                    grid[y][x] = TILE_NORMAL;
                    hazardMap[y][x] = 0.0;
                }
            }
        }

        // Dynamic Obstacle Inflation for 48x27 High-Res Grid
        function getInflationRadius() {
            if (weightNear <= 2.0) return 0;
            if (weightNear <= 5.0) return 1.8;
            if (weightNear <= 10.0) return 3.2;
            if (weightNear <= 15.0) return 4.5;
            return 6.0; // Deep inflation up to 6 tiles
        }

        function computeHazardMap() {
            const maxRadius = getInflationRadius();

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (grid[y][x] === TILE_WALL) {
                        hazardMap[y][x] = 0;
                        continue;
                    }

                    if (maxRadius <= 0) {
                        hazardMap[y][x] = 0;
                        continue;
                    }

                    let minD = 999;
                    const searchBox = Math.ceil(maxRadius);
                    for (let dy = -searchBox; dy <= searchBox; dy++) {
                        for (let dx = -searchBox; dx <= searchBox; dx++) {
                            const ny = y + dy;
                            const nx = x + dx;
                            if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS) {
                                if (grid[ny][nx] === TILE_WALL) {
                                    const d = Math.hypot(dx, dy);
                                    if (d < minD) minD = d;
                                }
                            }
                        }
                    }

                    if (minD <= maxRadius) {
                        const decay = (maxRadius - minD + 0.4) / maxRadius;
                        hazardMap[y][x] = Math.max(0.0, Math.min(1.0, decay));
                    } else {
                        hazardMap[y][x] = 0.0;
                    }
                }
            }
        }

        function buildGridDOM() {
            DOM.gridContainer.innerHTML = '';
            DOM.gridContainer.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            DOM.gridContainer.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'map-cell tile-normal';
                    cell.id = `cell-${x}-${y}`;

                    cell.addEventListener('click', () => {
                        if (grid[y][x] === TILE_WALL) return;
                        startPos = { x, y };
                        updateCellVisuals();
                        runAStarInstant();
                    });

                    DOM.gridContainer.appendChild(cell);
                }
            }
            window.addEventListener('resize', () => { positionCharacterSprite(startPos.x, startPos.y); });
        }

        function updateCellVisuals() {
            computeHazardMap();

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = document.getElementById(`cell-${x}-${y}`);
                    if (!cell) continue;

                    cell.className = 'map-cell';

                    if (grid[y][x] === TILE_WALL) cell.classList.add('tile-wall');
                    else if (grid[y][x] === TILE_ROCK) cell.classList.add('tile-rock');
                    else if (grid[y][x] === TILE_SAND) cell.classList.add('tile-sand');
                    else cell.classList.add('tile-normal');

                    if (grid[y][x] !== TILE_WALL && hazardMap[y][x] > 0) {
                        const h = hazardMap[y][x];
                        if (h >= 0.75) cell.classList.add('hazard-1');
                        else if (h >= 0.5) cell.classList.add('hazard-2');
                        else if (h >= 0.25) cell.classList.add('hazard-3');
                        else cell.classList.add('hazard-4');
                    }

                    if (x === startPos.x && y === startPos.y) {
                        cell.classList.add('cell-start');
                        cell.innerHTML = '🚩';
                    } else if (x === goalPos.x && y === goalPos.y) {
                        cell.classList.add('cell-goal');
                        cell.innerHTML = '<span class="goal-star">★</span>';
                    } else {
                        cell.innerHTML = '';
                    }
                }
            }
            positionCharacterSprite(startPos.x, startPos.y);
        }

        function positionCharacterSprite(gx, gy) {
            const cell = document.getElementById(`cell-${gx}-${gy}`);
            if (!cell || !DOM.charSprite) return;
            const rect = cell.getBoundingClientRect();
            const wrapRect = DOM.mapStage.getBoundingClientRect();

            DOM.charSprite.style.display = 'flex';
            DOM.charSprite.style.left = `${rect.left - wrapRect.left + rect.width / 2 - 11}px`;
            DOM.charSprite.style.top = `${rect.top - wrapRect.top - 20}px`;
        }

        // =========================================================================
        // COHESIVE BIOME CLUSTERS (SCALED FOR 48 × 27 HIGH-RES TILES)
        // =========================================================================
        function generateContiguousClusters() {
            initGrid();

            startPos = { x: 2, y: 3 + Math.floor(Math.random() * (ROWS - 6)) };
            goalPos  = { x: COLS - 3, y: 3 + Math.floor(Math.random() * (ROWS - 6)) };

            const protectedCells = new Set();
            for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++) {
                    protectedCells.add(`${startPos.x + dx},${startPos.y + dy}`);
                    protectedCells.add(`${goalPos.x + dx},${goalPos.y + dy}`);
                }
            }

            function growContiguousBlob(seedX, seedY, targetTile, targetSize) {
                const blob = new Set();
                const queue = [{ x: seedX, y: seedY }];
                blob.add(`${seedX},${seedY}`);

                while (queue.length > 0 && blob.size < targetSize) {
                    const idx = Math.floor(Math.random() * queue.length);
                    const cur = queue.splice(idx, 1)[0];

                    const dirs = [
                        { dx: 1, dy: 0 }, { dx: -1, dy: 0 },
                        { dx: 0, dy: 1 }, { dx: 0, dy: -1 }
                    ];
                    dirs.sort(() => Math.random() - 0.5);

                    for (const d of dirs) {
                        const nx = cur.x + d.dx;
                        const ny = cur.y + d.dy;
                        const key = `${nx},${ny}`;

                        if (nx >= 4 && nx < COLS - 4 && ny >= 2 && ny < ROWS - 2) {
                            if (!protectedCells.has(key) && !blob.has(key) && grid[ny][nx] === TILE_NORMAL) {
                                blob.add(key);
                                grid[ny][nx] = targetTile;
                                queue.push({ x: nx, y: ny });
                                if (blob.size >= targetSize) break;
                            }
                        }
                    }
                }
            }

            // 1. High-Res Rocky Mountain Ridges (3-4 clusters of 35-70 cells each)
            const rockCount = 3 + Math.floor(Math.random() * 2);
            for (let i = 0; i < rockCount; i++) {
                const rx = 8 + Math.floor(Math.random() * (COLS - 16));
                const ry = 3 + Math.floor(Math.random() * (ROWS - 7));
                const massSize = 35 + Math.floor(Math.random() * 35);
                growContiguousBlob(rx, ry, TILE_ROCK, massSize);
            }

            // 2. High-Res Desert Sand Dune Expanses (3-4 clusters of 45-90 cells each)
            const sandCount = 3 + Math.floor(Math.random() * 2);
            for (let i = 0; i < sandCount; i++) {
                const sx = 8 + Math.floor(Math.random() * (COLS - 16));
                const sy = 3 + Math.floor(Math.random() * (ROWS - 7));
                const duneSize = 45 + Math.floor(Math.random() * 45);
                growContiguousBlob(sx, sy, TILE_SAND, duneSize);
            }

            // 3. Fortress Obstacle Wall Ruins (4-6 walls of 5-10 cells creating corridors)
            const wallCount = 4 + Math.floor(Math.random() * 3);
            for (let i = 0; i < wallCount; i++) {
                const wx = 10 + Math.floor(Math.random() * (COLS - 20));
                const wy = 3 + Math.floor(Math.random() * (ROWS - 8));
                const len = 6 + Math.floor(Math.random() * 5);
                const isVertical = Math.random() > 0.45;

                for (let s = 0; s < len; s++) {
                    const cx = isVertical ? wx : wx + s;
                    const cy = isVertical ? wy + s : wy;
                    if (cx >= 4 && cx < COLS - 4 && cy >= 2 && cy < ROWS - 2) {
                        if (!protectedCells.has(`${cx},${cy}`)) {
                            grid[cy][cx] = TILE_WALL;
                        }
                    }
                }
            }

            // Guarantee open path from start to goal
            let wx = startPos.x;
            let wy = startPos.y;
            while (wx < goalPos.x) {
                if (grid[wy][wx] === TILE_WALL) grid[wy][wx] = TILE_NORMAL;
                if (Math.random() > 0.45) wx++;
                else {
                    const stepY = (wy < goalPos.y) ? 1 : (wy > goalPos.y ? -1 : (Math.random() > 0.5 ? 1 : -1));
                    if (wy + stepY >= 1 && wy + stepY < ROWS - 1) wy += stepY;
                }
            }

            updateCellVisuals();
            runAStarInstant();
        }

        // Traversal Cost Formula
        function getTileTraversalCost(x, y) {
            if (grid[y][x] === TILE_WALL) return Infinity;
            let cost = 1.0;
            if (grid[y][x] === TILE_ROCK) cost += weightRock;
            if (grid[y][x] === TILE_SAND) cost += weightSand;
            if (hazardMap[y][x] > 0) {
                cost += (hazardMap[y][x] * weightNear * 2.5);
            }
            return cost;
        }

        function heuristic(x1, y1, x2, y2) {
            return Math.hypot(x1 - x2, y1 - y2);
        }

        function runAStarInstant() {
            nodeDetails.clear();
            closedSet.clear();
            pathNodes = [];

            document.querySelectorAll('.map-cell').forEach(c => {
                c.classList.remove('cell-path');
            });

            const startKey = `${startPos.x},${startPos.y}`;
            const startNode = {
                x: startPos.x, y: startPos.y,
                g: 0, h: heuristic(startPos.x, startPos.y, goalPos.x, goalPos.y),
                f: 0, parent: null
            };
            startNode.f = startNode.g + startNode.h;

            openSet = [startNode];
            nodeDetails.set(startKey, startNode);

            while (openSet.length > 0) {
                let lowestIdx = 0;
                for (let i = 1; i < openSet.length; i++) {
                    if (openSet[i].f < openSet[lowestIdx].f) lowestIdx = i;
                }

                const current = openSet.splice(lowestIdx, 1)[0];
                const currentKey = `${current.x},${current.y}`;
                closedSet.add(currentKey);

                if (current.x === goalPos.x && current.y === goalPos.y) {
                    reconstructPath(current);
                    return true;
                }

                const neighbors = [
                    { dx: 0, dy: -1, diag: false },
                    { dx: 1, dy: 0,  diag: false },
                    { dx: 0, dy: 1,  diag: false },
                    { dx: -1, dy: 0, diag: false },
                    { dx: 1, dy: -1, diag: true },
                    { dx: 1, dy: 1,  diag: true },
                    { dx: -1, dy: 1, diag: true },
                    { dx: -1, dy: -1, diag: true }
                ];

                for (const nb of neighbors) {
                    const nx = current.x + nb.dx;
                    const ny = current.y + nb.dy;

                    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
                    if (grid[ny][nx] === TILE_WALL) continue;
                    if (nb.diag && (grid[current.y][nx] === TILE_WALL || grid[ny][current.x] === TILE_WALL)) continue;

                    const neighborKey = `${nx},${ny}`;
                    if (closedSet.has(neighborKey)) continue;

                    const stepDist = nb.diag ? Math.SQRT2 : 1.0;
                    const tileCost = getTileTraversalCost(nx, ny);
                    const tentativeG = current.g + (stepDist * tileCost);

                    let neighborNode = nodeDetails.get(neighborKey);

                    if (!neighborNode) {
                        neighborNode = {
                            x: nx, y: ny, g: tentativeG,
                            h: heuristic(nx, ny, goalPos.x, goalPos.y),
                            f: 0, parent: current
                        };
                        neighborNode.f = neighborNode.g + neighborNode.h;
                        nodeDetails.set(neighborKey, neighborNode);
                        openSet.push(neighborNode);
                    } else if (tentativeG < neighborNode.g) {
                        neighborNode.g = tentativeG;
                        neighborNode.f = neighborNode.g + neighborNode.h;
                        neighborNode.parent = current;
                    }
                }
            }
            return false;
        }

        function reconstructPath(goalNode) {
            pathNodes = [];
            let curr = goalNode;
            while (curr) {
                pathNodes.push(curr);
                curr = curr.parent;
            }
            pathNodes.reverse();

            pathNodes.forEach((node) => {
                const cell = document.getElementById(`cell-${node.x}-${node.y}`);
                if (cell && (node.x !== startPos.x || node.y !== startPos.y) && (node.x !== goalPos.x || node.y !== goalPos.y)) {
                    cell.classList.add('cell-path');
                }
            });
        }

        // Sliders Listeners
        DOM.sliderRock.addEventListener('input', (e) => {
            weightRock = parseFloat(e.target.value);
            DOM.valRock.textContent = `${weightRock.toFixed(1)}×`;
            runAStarInstant();
        });

        DOM.sliderSand.addEventListener('input', (e) => {
            weightSand = parseFloat(e.target.value);
            DOM.valSand.textContent = `${weightSand.toFixed(1)}×`;
            runAStarInstant();
        });

        DOM.sliderNear.addEventListener('input', (e) => {
            weightNear = parseFloat(e.target.value);
            const r = Math.round(getInflationRadius());
            DOM.valNear.textContent = `${weightNear.toFixed(1)}× (Radius: ${r})`;
            updateCellVisuals();
            runAStarInstant();
        });

        DOM.btnRandomize.addEventListener('click', () => {
            generateContiguousClusters();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyR') { e.preventDefault(); generateContiguousClusters(); }
        });

        // Boot
        buildGridDOM();
        generateContiguousClusters();
    </script>
</body>
</html>
